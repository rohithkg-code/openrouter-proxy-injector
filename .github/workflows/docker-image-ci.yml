name: "Build and Publish docker images"
env:
  DOCKERHUB_REPOSITORY: serjs/openrouter-proxy-injector
on:
  pull_request:
    branches: oss
  push:
    branches: oss
  release:
    types: [published, edited]
jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: hadolint
        uses: hadolint/hadolint-action@v1.5.0
        with:
          ignore: DL3018
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Set up Docker Buildx
        id: buildx
        uses: crazy-max/ghaction-docker-buildx@v1.1.0
      - name: Print builder available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - id: meta
        uses: docker/metadata-action@v3
        with:
          images: |
            serjs/openrouter-proxy-injector
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'oss') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
      - name: Dockerhub login
        uses: docker/login-action@v2
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Github container registry login
        uses: docker/login-action@v2
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Run Buildx for amd64, armv7, arm64 architectures
        uses: docker/build-push-action@v2
        with:
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
